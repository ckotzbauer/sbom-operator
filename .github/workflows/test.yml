name: test

on:
  pull_request: {}
  push:
    branches:
      - "**"

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  test:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@f5a14d385a1f71e8120fd6568b8a85df921b6db3 # 0.58.3
    with:
      install-go: true
      install-goreleaser: true
      install-cosign: true
      install-syft: true
      build-commands: make build
      test-commands: make test
      report-coverage: true
      coverage-file: cover.out
      build-image: true
      docker-tag: ghcr.io/ckotzbauer/sbom-operator:latest
