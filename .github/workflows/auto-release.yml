name: auto-release

on:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write

jobs:
  auto-release:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-auto-release.yml@e01cb893cb20b3cc9796e6b2d777491734ef774f # 0.58.0
    with:
      release-workflow: create-release.yml
    secrets:
      token: ${{ secrets.REPO_ACCESS }}