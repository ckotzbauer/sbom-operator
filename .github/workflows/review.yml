name: review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-review.yml@e01cb893cb20b3cc9796e6b2d777491734ef774f # 0.58.0
    secrets:
      openrouter-token: ${{ secrets.OPENROUTER_TOKEN }}
