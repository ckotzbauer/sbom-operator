name: review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-review.yml@70492262e47019908260a22d989ea8c55c549cdb # 0.58.1
    secrets:
      openrouter-token: ${{ secrets.OPENROUTER_TOKEN }}
