name: review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-review.yml@f5a14d385a1f71e8120fd6568b8a85df921b6db3 # 0.58.3
    secrets:
      openrouter-token: ${{ secrets.OPENROUTER_TOKEN }}
