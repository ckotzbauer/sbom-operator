name: review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-review.yml@3e8ffeb9c11a5b7d61f8a33ec27a9ca5ca3180e3 # 0.58.2
    secrets:
      openrouter-token: ${{ secrets.OPENROUTER_TOKEN }}
