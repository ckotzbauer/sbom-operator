name: code-checks

on:
  pull_request: {}
  push:
    branches:
      - "**"

permissions:
  actions: read
  contents: read

jobs:
  gosec:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@f5a14d385a1f71e8120fd6568b8a85df921b6db3 # 0.58.3
    with:
      install-go: true
      go-version: "1.26"
      lint-commands: |
        make bootstrap-tools
        make lintsec

  golint:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@f5a14d385a1f71e8120fd6568b8a85df921b6db3 # 0.58.3
    with:
      install-go: true
      go-version: "1.26"
      lint-commands: |
        make bootstrap-tools
        make lint
