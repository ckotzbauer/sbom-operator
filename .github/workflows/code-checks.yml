name: code-checks

on:
  pull_request: {}
  push:
    branches:
      - "**"

permissions:
  actions: read
  contents: read

jobs:
  gosec:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@e01cb893cb20b3cc9796e6b2d777491734ef774f # 0.58.0
    with:
      install-go: true
      lint-commands: |
        make bootstrap-tools
        make lintsec

  golint:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@e01cb893cb20b3cc9796e6b2d777491734ef774f # 0.58.0
    with:
      install-go: true
      lint-commands: |
        make bootstrap-tools
        make lint
