name: code-checks

on:
  pull_request: {}
  push:
    branches:
      - "**"

permissions:
  actions: read
  contents: read

jobs:
  gosec:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@fd699521fc995525d339964a82f6f781581bf471 # 0.57.0
    with:
      install-go: true
      lint-commands: |
        make bootstrap-tools
        make lintsec

  golint:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@fd699521fc995525d339964a82f6f781581bf471 # 0.57.0
    with:
      install-go: true
      lint-commands: |
        make bootstrap-tools
        make lint
